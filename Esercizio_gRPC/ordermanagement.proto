syntax = "proto3";
package ecommerce;

service OrderManagement{

    rpc addOrder(Order) returns (StringMessage){}
    rpc getOrder(StringMessage) returns (Order);

}

message Order{
    string id=1;
    repeated string items=2;
    string description=3;
    float price=4;
    string destination=5;
}

message StringMessage{
    string id=1;
}

